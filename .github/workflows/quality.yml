name: Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  quality-gate:
    name: quality-gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ hashFiles('**/Cargo.toml') != '' }}
        with:
          components: clippy, rustfmt

      - uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install jujutsu (Linux)
        if: runner.os == 'Linux'
        env:
          JJ_VERSION: v0.46.0
        run: |
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$RUNNER_TEMP" ./jj
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install jujutsu (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JJ_VERSION: v0.46.0
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "jj.zip"
          $dir = Join-Path $env:RUNNER_TEMP "jj"
          Invoke-WebRequest "https://github.com/jj-vcs/jj/releases/download/$env:JJ_VERSION/jj-$env:JJ_VERSION-x86_64-pc-windows-msvc.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify jujutsu
        run: jj --version

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Tests + coverage
        run: uv run pytest --cov --cov-report=xml --cov-fail-under=60

      - name: Security audit
        run: uv run pip-audit --skip-editable

      - name: Install cargo-audit
        if: ${{ hashFiles('**/Cargo.toml') != '' }}
        run: cargo install --locked cargo-audit

      - name: Rust format check
        if: ${{ hashFiles('**/Cargo.toml') != '' }}
        run: cargo fmt --check

      - name: Rust lint (clippy)
        if: ${{ hashFiles('**/Cargo.toml') != '' }}
        run: cargo clippy -- -D warnings

      - name: Rust tests
        if: ${{ hashFiles('**/Cargo.toml') != '' }}
        run: cargo test

      - name: Rust security audit
        if: ${{ hashFiles('**/Cargo.toml') != '' }}
        run: cargo audit
