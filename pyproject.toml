[tool.uv.workspace]
members = [
    "packages/copilot-fusion",
    "packages/contextwell-core",
    "packages/contextwell-diff",
    "packages/contextwell-git",
    "packages/contextwell-tools",
    "packages/shared",
]

[tool.uv.sources]
copilot-fusion = { workspace = true }
copilot-fusion-shared = { workspace = true }
contextwell-core = { workspace = true }
contextwell-diff = { workspace = true }
contextwell-git = { workspace = true }
contextwell-tools = { workspace = true }

[dependency-groups]
dev = [
    "pip-audit>=2.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
