[project]
name = "copilot-fusion"
version = "0.1.0"
description = "Unified MCP server combining contextwell-core, contextwell-git, and contextwell-tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.0",
    "copilot-fusion-shared>=0.1.0",
    "contextwell-core>=0.1.0",
    "contextwell-diff>=0.1.0",
    "contextwell-git>=0.1.0",
    "contextwell-tools>=0.1.0",
]

[project.scripts]
copilot-fusion = "copilot_fusion.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_fusion"]

