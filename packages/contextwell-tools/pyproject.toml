[project]
name = "contextwell-tools"
version = "0.1.0"
description = "Filesystem and code tools domain for copilot-fusion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.0",
    "copilot-fusion-shared>=0.1.0",
    "pyyaml>=6.0.2",
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contextwell_tools"]
