[project]
name = "contextwell-tools"
version = "0.1.0"
description = "Filesystem and code tools domain for copilot-fusion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.0",
    "copilot-fusion-shared>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contextwell_tools"]

